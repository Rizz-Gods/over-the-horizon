name: Curate public release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy, sanitize, test, and publish the curated source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = Join-Path $env:RUNNER_TEMP "prepare_oth_release.py"
          @'
          import json
          import os
          import re
          import shutil
          import subprocess
          import textwrap
          from pathlib import Path

          repo = Path.cwd()
          source = Path(os.environ["RUNNER_TEMP"]) / "oth-source"
          subprocess.run(
              ["git", "clone", "--depth", "1", "https://github.com/Rizz-Gods/Apagain.git", str(source)],
              check=True,
          )

          selected = [
              "oth", "tests", "docs", "config", "console/index.html",
              "pyproject.toml", "pytest.ini", "LICENSE",
              "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md",
          ]
          for relative in selected:
              src = source / relative
              dst = repo / relative
              if not src.exists():
                  raise FileNotFoundError(f"Required source path missing: {relative}")
              if src.is_dir():
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)

          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def save_json(path, value):
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def sanitize_agent_paths(value):
              if isinstance(value, list):
                  for item in value:
                      sanitize_agent_paths(item)
              elif isinstance(value, dict):
                  for key, item in list(value.items()):
                      if key == "browser_executable":
                          value[key] = "chrome.exe"
                      elif key == "browser_profile":
                          leaf = str(item).replace("\\", "/").rstrip("/").split("/")[-1]
                          value[key] = f"data/browser_profiles/{leaf or 'default'}"
                      else:
                          sanitize_agent_paths(item)

          config = repo / "config"
          agents = load_json(config / "agents.json")
          sanitize_agent_paths(agents)
          save_json(config / "agents.json", agents)

          autonomy = load_json(config / "autonomy.json")
          if isinstance(autonomy.get("pilot"), dict):
              autonomy["pilot"]["name"] = "Operator"
          save_json(config / "autonomy.json", autonomy)

          brand = load_json(config / "brand_identity.json")
          brand["codename"] = "OTH"
          brand["public_identity"] = "Over The Horizon"
          brand["business_contact"] = ""
          if isinstance(brand.get("github"), dict):
              brand["github"]["use_brand_email_for_operations"] = False
          save_json(config / "brand_identity.json", brand)

          browser = load_json(config / "browser.json")
          browser["chrome_executable"] = "chrome.exe"
          browser["profile"] = "data/browser_profiles/oth"
          save_json(config / "browser.json", browser)

          media = load_json(config / "media.json")
          media["ffmpeg"] = "ffmpeg"
          media["ffprobe"] = "ffprobe"
          save_json(config / "media.json", media)

          tools = load_json(config / "tools.json")
          for tool in tools.get("tools", []):
              if tool.get("id") == "tool.ffmpeg":
                  tool["executable"] = "ffmpeg"
              elif tool.get("id") == "tool.git-lfs":
                  tool["executable"] = "git-lfs"
          save_json(config / "tools.json", tools)

          production = load_json(config / "production.json")
          production["executable_candidates"] = ["Resolve.exe"]
          save_json(config / "production.json", production)

          # Make the Windows short-name / long-name path comparison robust.
          fallback_path = repo / "oth/core/resilient_fallbacks.py"
          code = fallback_path.read_text(encoding="utf-8")
          helper = textwrap.dedent("""
              def _workspace_relative_path(path: Path, root: Path) -> Path:
                  \"\"\"Return a path relative to root, including Windows 8.3 aliases.\"\"\"
                  path = Path(path)
                  root = Path(root)
                  parts = []
                  current = path
                  while True:
                      try:
                          if current.samefile(root):
                              return Path(*reversed(parts)) if parts else Path(".")
                      except OSError:
                          pass
                      if current.parent == current:
                          break
                      parts.append(current.name)
                      current = current.parent
                  raise ValueError(f"{path} is outside workspace {root}")
          """)
          if "def _workspace_relative_path(" not in code:
              marker = "@dataclass"
              if marker not in code:
                  raise RuntimeError("Could not find import/class boundary for path helper")
              code = code.replace(marker, helper + marker, 1)
          old_guard = 'if not path.is_file() or not path.is_relative_to(self.root.resolve()):'
          new_guard = '''if not path.is_file():
                      return FallbackResult(False, {"fallback": True}, "media_ref must resolve inside the OTH workspace")
                  try:
                      relative_path = _workspace_relative_path(path, self.root)
                  except ValueError:
                      return FallbackResult(False, {"fallback": True}, "media_ref must resolve inside the OTH workspace")'''
          if old_guard in code:
              code = code.replace(old_guard, new_guard, 1)
          elif new_guard not in code:
              raise RuntimeError("Could not apply Windows workspace-path compatibility fix")
          code = code.replace('"media_ref": str(path.relative_to(self.root)),', '"media_ref": str(relative_path),', 1)
          fallback_path.write_text(code, encoding="utf-8")

          gitignore = textwrap.dedent("""
          # Python
          __pycache__/
          *.py[cod]
          *.pyo
          *.egg-info/
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          .coverage
          htmlcov/

          # Environments and packaging
          .venv/
          venv/
          build/
          dist/

          # Runtime state and local data
          /data/
          *.db
          *.sqlite
          *.sqlite3
          *.secure
          *.pid
          *.log

          # Local secrets and settings
          .env
          .env.*
          !.env.example
          config/*.local.json

          # OS/editor files
          .DS_Store
          Thumbs.db
          .vscode/
          """).lstrip()
          (repo / ".gitignore").write_text(gitignore, encoding="utf-8")

          architecture = textwrap.dedent("""
          # Architecture

          Over The Horizon (OTH) is a local-first runtime. Its main boundary is the task kernel: callers submit work to the kernel, the kernel stores execution state, applies policy checks, selects a worker, and records the outcome.

          ## Execution path

          1. **Submission** — the CLI or another local caller describes a capability, action, payload, and risk level.
          2. **Persistence** — task and mission stores write state to SQLite beneath the local runtime data directory.
          3. **Policy evaluation** — the policy gate checks the requested operation against its risk and permission requirements. Operations that require approval should remain blocked until an operator approves them.
          4. **Routing** — registries and lane configuration select a suitable worker or fallback.
          5. **Execution** — built-in, browser, or external adapters perform the operation. Integrations may invoke local programs or external providers.
          6. **Evaluation and audit** — results are normalized, evaluated, and persisted with mission progress and audit information.
          7. **Recovery** — retry, replay, cancellation, continuity, and mission-state helpers support operator-led recovery.

          ## Main packages

          - `oth/core/kernel.py` — runtime composition and task orchestration.
          - `oth/core/db.py` and `oth/core/mission_state.py` — SQLite-backed task and mission persistence.
          - `oth/core/policy.py` — risk and approval checks.
          - `oth/core/registry.py`, `workforce.py`, `tools.py`, and `lanes.py` — capability, worker, tool, and execution-lane registration.
          - `oth/workers/` — built-in, browser, and external worker adapters.
          - `oth/cli.py` — command-line entry point.
          - `oth/console.py` and `console/index.html` — local operator console.
          - `config/` — runtime behaviour and integration configuration.
          - `tests/` — automated unit and contract tests.

          ## Trust boundaries

          Agent and model output is untrusted input. External commands, browser sessions, provider APIs, local files, and public publishing destinations are separate trust boundaries. The policy layer is intended to gate consequential operations, but every adapter still needs its own review, tests, and least-privilege configuration.

          The current credential store uses Windows DPAPI. The integrated runtime is therefore Windows-first; this is not yet a cross-platform secure-storage abstraction.

          ## State and data

          The application creates its databases, browser profiles, logs, and encrypted credential state locally under `data/`. This directory is intentionally excluded from version control. Do not commit production databases, browser profiles, token stores, generated media, or operational logs.
          """).lstrip()
          (repo / "docs/ARCHITECTURE.md").write_text(architecture, encoding="utf-8")

          configuration = textwrap.dedent("""
          # Configuration

          Runtime defaults are stored as JSON under `config/`. The checked-in files use machine-neutral executable names and relative runtime paths. Adapt them to your environment before enabling optional workers.

          ## Machine-specific values

          - `config/agents.json` — agent commands and browser adapter settings.
          - `config/browser.json` — Chrome executable and local browser-profile directory.
          - `config/tools.json` — commands for Git, Python, Node.js, FFmpeg, Git LFS, Hermes, and Agent Browser.
          - `config/media.json` — FFmpeg and FFprobe commands.
          - `config/production.json` — DaVinci Resolve executable candidates and media defaults.
          - `config/model_routing.json` — local model provider and model names.
          - `config/policies.json` and `config/workforce.json` — risk, permissions, and worker capability defaults.

          Use executable names only when the executable is available on `PATH`; otherwise configure its full path locally. Keep personal overrides out of commits. Prefer environment variables or a separate local configuration file for secrets.

          ## Credentials

          Do not store API keys, OAuth refresh tokens, passwords, or browser cookies in these JSON files. The current credential store uses Windows DPAPI to bind encrypted token material to the local Windows user. Copying the encrypted store to another account or machine is not a supported migration path.

          ## External integrations

          External providers and desktop programs are optional. Install each dependency independently, check its terms and access requirements, and test it with disposable accounts or data. A configured command does not imply that the external service is authenticated or that the integration is approved for use.
          """).lstrip()
          (repo / "docs/CONFIGURATION.md").write_text(configuration, encoding="utf-8")

          # Do not publish operational state or unrelated local helper scripts.
          for name in ["data", "ops", "businesses", "Over_The_Horizon_Mission_State.md", "opencode.json"]:
              path = repo / name
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  path.unlink()

          secret_patterns = [
              re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"AIza[0-9A-Za-z_-]{25,}"),
              re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}"),
          ]
          forbidden_strings = [
              "apvarchas@gmail.com",
              r"C:\Users\Admin",
              r"AppData\Local\Microsoft\WinGet",
              r"Over-The-Horizon\data\browser_profiles",
          ]
          violations = []
          for path in repo.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.relative_to(repo).as_posix() == ".github/workflows/bootstrap-release.yml":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if any(token in text for token in forbidden_strings):
                  violations.append(str(path.relative_to(repo)))
              if any(pattern.search(text) for pattern in secret_patterns):
                  violations.append(str(path.relative_to(repo)))
          if violations:
              raise RuntimeError("Sanitation scan found possible private paths or credentials: " + ", ".join(sorted(set(violations))))
          print(f"Curated {len(selected)} source paths. Sanitation scan passed.")
          '@ | Set-Content -Path $scriptPath -Encoding utf8

          python $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "Source curation or sanitation failed." }

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          python -m compileall -q oth
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw "Test suite failed; release was not published." }

          Write-Host "Keeping bootstrap workflow unchanged during the code-only release push."
          git checkout --orphan clean-release
          git add -A
          git -c user.name="Rizz-Gods" -c user.email="186173805+Rizz-Gods@users.noreply.github.com" commit -m "Initial public release: Over The Horizon"
          if ($LASTEXITCODE -ne 0) { throw "Initial release commit failed." }
          git push --force origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Publishing the curated release failed." }
          Write-Host ("Published commit " + (git rev-parse HEAD))
